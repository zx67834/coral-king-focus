<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>珊瑚王的专注游戏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var t = localStorage.getItem("app-theme") || "green";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">▦</span>
        <h1>珊瑚王的专注游戏</h1>
      </div>
      <div class="header-actions">
        <div class="theme-switcher" role="group" aria-label="背景主题">
          <button type="button" class="theme-dot" data-theme="dark" title="深色" aria-label="深色"></button>
          <button type="button" class="theme-dot" data-theme="light" title="浅色" aria-label="浅色"></button>
          <button type="button" class="theme-dot" data-theme="green" title="护眼绿" aria-label="护眼绿"></button>
          <button type="button" class="theme-dot" data-theme="warm" title="暖色" aria-label="暖色"></button>
        </div>
        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="sudoku" role="tab" aria-selected="true">数独</button>
          <button class="tab" data-tab="schulte" role="tab" aria-selected="false">舒尔特方格</button>
        </nav>
      </div>
    </header>

    <main>
      <!-- 数独 -->
      <section id="panel-sudoku" class="panel active" role="tabpanel">
        <div id="sudoku-standalone-nav" class="sudoku-standalone-nav" hidden>
          <button type="button" class="btn btn-ghost" id="sudoku-exit-standalone">← 返回首页</button>
          <span class="standalone-badge" title="无提示，填完后自动检测">独立模式 · 无提示</span>
        </div>
        <div class="game-layout">
          <div class="board-wrap">
            <div id="sudoku-grid" class="sudoku-grid" aria-label="数独棋盘"></div>
          </div>
          <aside class="sidebar">
            <div class="stat-row">
              <span class="stat-label">用时</span>
              <span id="sudoku-timer" class="stat-value mono">00:00</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">难度</span>
              <select id="sudoku-difficulty" class="select">
                <option value="easy">简单</option>
                <option value="medium" selected>中等</option>
                <option value="hard">困难</option>
                <option value="expert">专家</option>
              </select>
            </div>
            <div class="numpad" id="sudoku-numpad"></div>
            <div class="btn-group">
              <button type="button" class="btn btn-secondary" id="sudoku-note-toggle">笔记模式</button>
              <button type="button" class="btn btn-secondary" id="sudoku-erase">擦除</button>
            </div>
            <div class="btn-group sudoku-assist" id="sudoku-assist">
              <button type="button" class="btn btn-ghost" id="sudoku-hint">提示</button>
              <button type="button" class="btn btn-ghost" id="sudoku-check">检查</button>
            </div>
            <button type="button" class="btn btn-primary btn-block" id="sudoku-new">新游戏</button>
            <button type="button" class="btn btn-secondary btn-block" id="sudoku-submit">提交答案</button>
            <button type="button" class="btn btn-secondary btn-block" id="sudoku-standalone-toggle">进入独立模式</button>
            <a href="sudoku.html" class="standalone-link" target="_blank" rel="noopener">在新标签页打开数独</a>
            <div class="history-box">
              <div class="history-head">
                <span class="stat-label">提交记录</span>
                <span class="stat-value mono" id="sudoku-history-count">0</span>
              </div>
              <ul id="sudoku-history-list" class="history-list">
                <li class="history-empty">还没有提交记录</li>
              </ul>
              <div class="btn-group">
                <button type="button" class="btn btn-ghost" id="sudoku-export-history">导出</button>
                <button type="button" class="btn btn-ghost" id="sudoku-clear-history">清空</button>
              </div>
            </div>
            <p id="sudoku-message" class="message" aria-live="polite"></p>
          </aside>
        </div>
      </section>

      <!-- 舒尔特方格 -->
      <section id="panel-schulte" class="panel" role="tabpanel" hidden>
        <div class="schulte-layout">
          <div class="schulte-info">
            <div class="stat-card">
              <span class="stat-label">当前目标</span>
              <span id="schulte-target" class="stat-value large mono">1</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">用时</span>
              <span id="schulte-timer" class="stat-value mono">0.00s</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">最佳纪录</span>
              <span id="schulte-best" class="stat-value mono">—</span>
            </div>
          </div>
          <div class="schulte-controls">
            <label class="control-label">
              方格大小
              <select id="schulte-size" class="select">
                <option value="3">3×3</option>
                <option value="4" selected>4×4</option>
                <option value="5">5×5</option>
                <option value="6">6×6</option>
              </select>
            </label>
            <button type="button" class="btn btn-primary" id="schulte-start">开始 / 重新开始</button>
          </div>
          <div id="schulte-grid" class="schulte-grid size-4" aria-label="舒尔特方格"></div>
          <p id="schulte-message" class="message center" aria-live="polite">点击「开始」后，按从小到大的顺序依次点击数字</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>数独：填满 9×9 格，每行、每列、每宫均含 1–9 且不重复 · 舒尔特：按顺序点击 1 到 N，训练专注力</p>
    </footer>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/sudoku-history.js"></script>
  <script src="js/sudoku.js"></script>
  <script src="js/schulte.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
